<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            th:href="@{/images/icon.svg}"
            href="/images/icon.svg"
        />
        <title>Профиль</title>
        <style>
            body {
                background-color: #2b1f1d;
                font-family: "Courier New", Courier, monospace;
                color: #2b2b2b;
            }

            header.bg-secondary {
                background-color: #3a4d5c;
                border-bottom: 3px double #1a2630;
                z-index: 10;
            }

            nav a:hover {
                text-decoration: underline !important;
            }

            .wood-table-container {
                max-width: 1200px;
                margin: 40px auto;
                padding: 40px;
                background-color: #8a5a36;
                background-image: url(/images/table.avif);
                background-repeat: no-repeat;
                background-size: 100% 100%;
                border-radius: 10%;
                box-shadow:
                    inset 0 0 40px rgba(0, 0, 0, 0.6),
                    0 20px 50px rgba(0, 0, 0, 0.8);
                position: relative;
            }

            footer.bg-secondary {
                background-color: #2d3748;
                border-top: 2px solid #1a202c;
                font-size: 0.9rem;
                z-index: 10;
            }

            .profile-paper-block {
                background-color: #fffde8;
                background-image: url(/images/paper.jpg);
                background-size: 20px 20px;
                border: 1px solid #9c8a70;
                border-radius: 4px;
                padding: 1.5rem;
                box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.35);
                margin-bottom: 2rem;
            }

            .profile-field-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 1.5rem;
                flex-wrap: wrap;
            }

            .profile-field {
                flex: 1 1 220px;
                min-width: 220px;
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
                padding: 0 1rem;
                border-right: 1px dashed #9c8a70;
            }

            .profile-field:last-child {
                border-right: none;
            }

            .profile-label {
                display: block;
                color: #1a365d;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-size: 0.95rem;
            }

            .profile-value {
                color: #2b2b2b;
                line-height: 1.4;
            }

            .password-masked {
                color: #5a5a5a;
                font-family: monospace;
                letter-spacing: 2px;
            }

            .profile-table-wrapper {
                background-color: #fffde8;
                background-image: url(/images/paper.jpg);
                background-size: 20px 20px;
                border: 1px solid #9c8a70;
                border-radius: 4px;
                padding: 1.5rem;
            }

            .table thead th {
                color: #1a365d;
                border-bottom: 2px solid #9c8a70;
                background-color: transparent;
            }

            .table tbody tr:hover {
                background-color: rgba(255, 253, 232, 0.6);
            }
        </style>
    </head>

    <body class="d-flex flex-column min-vh-100">
        <header class="bg-secondary text-white py-3">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center">
                    <a
                        href="/"
                        class="text-white text-decoration-none fw-bold fs-2"
                        >Заметки</a
                    >
                    <nav class="d-flex gap-4">
                        <a
                            href="/trash"
                            class="text-white text-decoration-none fs-5"
                            >Корзина</a
                        >
                        <div th:if="${#authorization.expression('isAuthenticated()')}">
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-link text-white text-decoration-none fs-5 p-0">Выйти</button>
                            </form>
                        </div>

                        <!-- Показываем «Войти», если НЕ авторизован -->
                        <a th:unless="${#authorization.expression('isAuthenticated()')}" href="/login" class="text-white text-decoration-none fs-5">Войти</a>
                    </nav>
                </div>
            </div>
        </header>

        <main class="container flex-grow-1 wood-table-container">
            <h1
                class="fw-bold mb-4 text-center"
                style="
                    text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.4);
                    color: #fffde8;
                    font-size: calc(1.375rem + 1.5vw);
                "
            >
                Профиль
            </h1>

            <div class="profile-paper-block">
                <h3
                    class="fw-bold text-center text-uppercase"
                    style="color: #1a365d"
                >
                    Данные пользователя
                </h3>
                <div class="profile-field-row">
                    <div class="profile-field">
                        <span class="profile-label">Email</span>
                        <span class="profile-value" th:text="${user.email}"
                            >user@example.com</span
                        >
                    </div>
                    <div class="profile-field">
                        <span class="profile-label">Пароль</span>
                        <span class="profile-value password-masked"
                            >••••••••</span
                        >
                    </div>
                </div>
            </div>

            <div class="profile-table-wrapper">
                <h3
                    class="fw-bold text-center text-uppercase"
                    style="color: #1a365d"
                >
                    Мои заметки
                </h3>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Название</th>
                                <th>Описание</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="note : ${notes}">
                                <td th:text="${note.title}">Название</td>
                                <td th:text="${note.content}">Описание</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="bg-secondary text-white py-4 mt-auto">
            <div class="container">
                <div class="text-white fs-5 mb-2 fw-bold text-center">
                    Системная информация:
                </div>
                <div class="row text-center">
                    <div class="col">Тел: 8 (800) 600-86-76</div>
                    <div class="col">СПбУТУиЭ</div>
                    <div class="col">© 2026 NoteTaking OS</div>
                </div>
            </div>
        </footer>
    </body>
</html>
