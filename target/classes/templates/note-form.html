<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            th:href="@{/images/icon.svg}"
            href="/images/icon.svg"
        />
        <title
            th:text="${noteId == null} ? 'Новая заметка' : 'Редактирование заметки'"
        >
            Заметка
        </title>
        <meta name="_csrf" th:content="${_csrf.token}" />
        <meta name="_csrf_header" th:content="${_csrf.headerName}" />
        <style>
            body {
                background-color: #2b1f1d;
                font-family: "Courier New", Courier, monospace;
                color: #2b2b2b;
            }
            header.bg-secondary {
                background-color: #3a4d5c;
                border-bottom: 3px double #1a2630;
                z-index: 10;
            }
            nav a:hover,
            nav button:hover {
                text-decoration: underline !important;
            }
            .wood-table-container {
                max-width: 1200px;
                margin: 40px auto;
                padding: 40px;
                background-color: #8a5a36;
                background-image: url(/images/table.avif);
                background-repeat: no-repeat;
                background-size: 100% 100%;
                border-radius: 10%;
                box-shadow:
                    inset 0 0 40px rgba(0, 0, 0, 0.6),
                    0 20px 50px rgba(0, 0, 0, 0.8);
                position: relative;
            }
            .login-card {
                background-color: #fffde8;
                background-image: url(/images/paper.jpg);
                background-size: 20px 20px;
                border: 2px solid #9c8a70;
                border-radius: 4px;
                box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.4);
                padding: 2rem;
            }
            .form-label {
                color: #1a365d;
                font-weight: bold;
                font-family: "Courier New", Courier, monospace;
            }
            .form-control {
                border: 1px solid #9c8a70;
                border-radius: 2px;
                font-family: "Courier New", Courier, monospace;
                background-color: #fffde8;
            }
            .form-control:focus {
                border-color: #5a5a5a;
                box-shadow: 0 0 0 0.25rem rgba(90, 90, 90, 0.25);
            }
            .btn-retro-dark {
                border: 2px solid #000;
                background-color: #222;
                color: #fff;
                border-radius: 2px;
                box-shadow: 4px 4px 0px #111;
                font-weight: bold;
                font-family: "Courier New", Courier, monospace;
            }
            .btn-retro-dark:hover {
                background-color: #000;
                box-shadow: 2px 2px 0px #111;
                transform: translate(1px, 1px);
                color: #fff;
            }
            .btn-retro-outline {
                border: 2px solid #5a5a5a;
                background-color: #f0edf5;
                color: #2b2b2b;
                border-radius: 2px;
                font-weight: bold;
                box-shadow: 2px 2px 0px #000;
                font-family: "Courier New", Courier, monospace;
            }
            .btn-retro-outline:hover {
                background-color: #e2dee9;
                transform: translate(1px, 1px);
                box-shadow: 1px 1px 0px #000;
                color: #2b2b2b;
            }
            .btn-retro-danger {
                border: 2px solid #702b2b;
                background-color: #f5e3df;
                color: #702b2b;
                border-radius: 2px;
                font-weight: bold;
                box-shadow: 2px 2px 0px #000;
                font-family: "Courier New", Courier, monospace;
            }
            .btn-retro-danger:hover {
                background-color: #e9c9c2;
                transform: translate(1px, 1px);
                box-shadow: 1px 1px 0px #000;
                color: #702b2b;
            }
            .attachments-block {
                background-color: #fffde8;
                border: 1px solid #9c8a70;
                border-radius: 4px;
                padding: 1.5rem;
                margin-top: 2rem;
            }
            #drop-zone {
                border: 2px dashed #9c8a70;
                background-color: #f0edf5;
                color: #1a365d;
                padding: 2rem;
                text-align: center;
                cursor: pointer;
                border-radius: 4px;
                transition: background-color 0.2s;
            }
            #drop-zone:hover,
            #drop-zone.dragover {
                background-color: #e2dee9;
            }
            footer.bg-secondary {
                background-color: #2d3748;
                border-top: 2px solid #1a202c;
                font-size: 0.9rem;
                z-index: 10;
            }
        </style>
    </head>

    <body class="d-flex flex-column min-vh-100">
        <header class="bg-secondary text-white py-3">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center">
                    <a
                        href="/"
                        class="text-white text-decoration-none fw-bold fs-2"
                        >Заметки</a
                    >
                    <nav class="d-flex gap-4">
                        <a
                            th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                            href="/admin"
                            class="text-white text-decoration-none fs-5"
                        >
                            Админка
                        </a>
                        <a
                            href="/trash"
                            class="text-white text-decoration-none fs-5"
                            >Корзина</a
                        >
                        <a
                            href="/profile"
                            class="text-white text-decoration-none fs-5"
                            >Профиль</a
                        >
                        <div>
                            <form
                                th:action="@{/logout}"
                                method="post"
                                class="d-inline"
                            >
                                <button
                                    type="submit"
                                    class="btn btn-link text-white text-decoration-none fs-5 p-0"
                                >
                                    Выйти
                                </button>
                            </form>
                        </div>
                        <!--                        <a-->
                        <!--                            href="/login"-->
                        <!--                            class="text-white text-decoration-none fs-5"-->
                        <!--                            >Войти</a-->
                        <!--                        >-->
                    </nav>
                </div>
            </div>
        </header>

        <main
            class="container flex-grow-1 wood-table-container d-flex justify-content-center"
        >
            <div class="w-100" style="max-width: 800px">
                <h1
                    class="fw-bold mb-4 text-center"
                    style="
                        text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.4);
                        color: #fffde8;
                        font-size: calc(1.375rem + 1.5vw);
                    "
                    th:text="${noteId == null} ? 'Новая заметка' : 'Редактирование заметки'"
                >
                    Заметка
                </h1>

                <div class="login-card">
                    <form
                        th:object="${noteRequest}"
                        th:action="${isAdminEdit != null and isAdminEdit} ? @{/admin/notes/{id}/edit(id=${noteId}, userId=${userId})} : (${noteId != null} ? @{/notes/edit/{id}(id=${noteId})} : @{/notes/add})"
                        method="post"
                        enctype="multipart/form-data"
                    >
                        <input
                            type="file"
                            id="file-input"
                            name="file"
                            multiple
                            class="d-none"
                        />

                        <div class="mb-3">
                            <label for="title" class="form-label"
                                >Заголовок</label
                            >
                            <input
                                type="text"
                                id="title"
                                th:field="*{title}"
                                class="form-control"
                                placeholder="Введите название..."
                            />
                            <span
                                th:if="${#fields.hasErrors('title')}"
                                th:errors="*{title}"
                                class="text-danger fw-bold small"
                            ></span>
                        </div>

                        <div class="mb-4">
                            <label for="content" class="form-label"
                                >Содержимое</label
                            >
                            <textarea
                                id="content"
                                th:field="*{content}"
                                class="form-control"
                                rows="8"
                                placeholder="Текст заметки..."
                            ></textarea>
                            <span
                                th:if="${#fields.hasErrors('content')}"
                                th:errors="*{content}"
                                class="text-danger fw-bold small"
                            ></span>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button
                                type="submit"
                                class="btn btn-retro-dark px-4"
                                th:text="${noteId == null} ? 'Создать' : 'Сохранить'"
                            >
                                Сохранить
                            </button>
                            <a
                                th:href="${isAdminEdit != null and isAdminEdit} ? @{/admin/users/{id}/notes(id=${userId})} : @{/notes}"
                                class="btn btn-retro-outline px-4"
                                >Отмена</a
                            >
                        </div>
                    </form>
                </div>

                <div class="attachments-block">
                    <h3 class="fw-bold mb-3" style="color: #1a365d">
                        Вложения
                    </h3>

                    <div id="drop-zone" class="mb-3">
                        <div class="fs-5 fw-bold mb-1">
                            Перетащите файлы сюда
                        </div>
                        <div class="text-muted small">
                            или нажмите, чтобы выбрать с компьютера
                        </div>
                    </div>

                    <div id="new-files-container" class="mb-3"></div>

                    <div th:if="${note != null}">
                        <div
                            th:if="${#lists.isEmpty(note.attachments)}"
                            class="text-muted fst-italic"
                        >
                            Файлов пока нет.
                        </div>
                        <ul
                            class="list-group"
                            th:unless="${#lists.isEmpty(note.attachments)}"
                        >
                            <li
                                class="list-group-item d-flex justify-content-between align-items-center"
                                style="
                                    background-color: #f0edf5;
                                    border-color: #9c8a70;
                                "
                                th:each="att : ${note.attachments}"
                            >
                                <div>
                                    <a
                                        th:href="@{/notes/{id}/files/{fid}(id=${note.id}, fid=${att.id})}"
                                        th:text="${att.fileName}"
                                        class="fw-bold text-decoration-none"
                                        style="color: #1a365d"
                                    ></a>
                                    <span class="text-muted small ms-2"
                                        >(<span th:text="${att.size}"></span>
                                        байт)</span
                                    >
                                </div>
                                <form
                                    th:action="@{/notes/{id}/files/{fid}/delete(id=${note.id}, fid=${att.id})}"
                                    method="post"
                                >
                                    <button
                                        type="submit"
                                        class="btn btn-retro-danger btn-sm"
                                    >
                                        Удалить
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>

        <footer class="bg-secondary text-white py-4 mt-auto">
            <div class="container">
                <div class="text-white fs-5 mb-2 fw-bold text-center">
                    Системная информация:
                </div>
                <div class="row text-center">
                    <div class="col-md-4">
                        <a
                            href="https://watchbutdonotlearn.github.io/"
                            title="lol"
                            style="color: white; text-decoration: none"
                        >
                            Обязательно проверить!!!
                        </a>
                    </div>
                    <div class="col">СПбУТУиЭ</div>
                    <div class="col-md-4">
                        <a
                            href="https://github.com/UltraKostik/note-taking-site"
                            title="Репозиторий"
                            style="color: white; text-decoration: none"
                        >
                            Репозиторий
                        </a>
                    </div>
                </div>
            </div>
        </footer>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const dropZone = document.getElementById("drop-zone");
                const fileInput = document.getElementById("file-input");
                const newFilesContainer = document.getElementById(
                    "new-files-container",
                );

                dropZone.addEventListener("click", () => fileInput.click());

                dropZone.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    dropZone.classList.add("dragover");
                });

                dropZone.addEventListener("dragleave", () => {
                    dropZone.classList.remove("dragover");
                });

                dropZone.addEventListener("drop", (e) => {
                    e.preventDefault();
                    dropZone.classList.remove("dragover");
                    fileInput.files = e.dataTransfer.files; // Кладем файлы в инпут формы
                    updateFileList();
                });

                fileInput.addEventListener("change", updateFileList);

                function updateFileList() {
                    newFilesContainer.innerHTML = ""; // Очищаем список
                    for (let i = 0; i < fileInput.files.length; i++) {
                        const badge = document.createElement("span");
                        badge.className = "badge bg-primary p-2 m-1 fs-6";
                        badge.textContent = fileInput.files[i].name;
                        newFilesContainer.appendChild(badge);
                    }
                }
            });
        </script>
    </body>
</html>
