<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <title>Корзина — Заметки</title>
    <style>
        .font-cursive { font-family: cursive; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="bg-secondary text-white py-3">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/" class="text-white text-decoration-none font-cursive fs-1">Заметки</a>
            <nav class="d-flex gap-4">
                <a href="/trash" class="text-white text-decoration-none font-cursive fs-5 text-decoration-underline">корзина</a>
                <a href="/login" class="text-white text-decoration-none font-cursive fs-5">войти</a>
            </nav>
        </div>
    </div>
</header>

<main class="container py-4 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4" th:unless="${#lists.isEmpty(deletedNotes)}">
        <h1 class="font-cursive m-0 fs-2">Удаленные заметки</h1>
        <form th:action="@{/trash/clear}" th:method="post">
            <button type="submit" class="btn btn-danger btn-sm font-cursive">Очистить корзину</button>
        </form>
    </div>

    <div class="text-center py-5" th:if="${#lists.isEmpty(deletedNotes)}">
        <h2 class="font-cursive text-muted fs-3">Здесь пусто</h2>
        <a th:href="@{/}" class="btn btn-secondary btn-sm font-cursive mt-3">Вернуться к заметкам</a>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4" th:unless="${#lists.isEmpty(deletedNotes)}">
        <div class="col" th:each="note : ${deletedNotes}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title font-cursive fw-bold" th:text="${note.title}">Название заметки</h5>
                    <p class="card-text text-muted" th:text="${note.content}">Текст удаленной заметки...</p>
                </div>
                <div class="card-footer bg-transparent border-top-0 d-flex justify-content-between">
                    <form th:action="@{/trash/restore/{id}(id=${note.id})}" th:method="post">
                        <button type="submit" class="btn btn-outline-success btn-sm font-cursive">Восстановить</button>
                    </form>
                    <form th:action="@{/trash/delete/{id}(id=${note.id})}" th:method="post">
                        <button type="submit" class="btn btn-outline-danger btn-sm font-cursive">Удалить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>

<footer class="bg-secondary text-white py-4 mt-auto">
    <div class="container">
        <div class="font-cursive fs-5 mb-2">Контактная информация</div>
        <div class="row text-center font-cursive">
            <div class="col">8 (800) 600-86-76<br>8 (800) 600-86-76</div>
            <div class="col">СПбУТУиЭ</div>
            <div class="col">© 2026 NoteTaking</div>
        </div>
    </div>
</footer>

</body>
</html>
