<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://jsdelivr.net"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Админка — Заметки</title>
</head>
<body>

<header class="header">
    <div class="section">
        <div class="headerflex">
            <a href="index.html" class="title ahref">Заметки</a>
            <div class="headerflex2">
                <a href="admin.html" class="ahref2 text-decoration-underline">админка</a>
                <a href="trashCan.html" class="ahref2">корзина</a>
            </div>
        </div>
    </div>
</header>

<section class="section content py-4">

    <h1 class="textcursive mb-4 fs-2">Панель администратора</h1>


    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="p-3 bg-light border rounded text-center">
                <div class="textcursive text-muted small">Пользователи</div>
                <div class="fs-3 fw-bold textcursive" th:text="${totalUsers}">150</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 bg-light border rounded text-center">
                <div class="textcursive text-muted small">Всего заметок</div>
                <div class="fs-3 fw-bold textcursive" th:text="${totalNotes}">1,420</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 bg-light border rounded text-center">
                <div class="textcursive text-muted small">В корзине</div>
                <div class="fs-3 fw-bold textcursive" th:text="${trashNotesCount}">84</div>
            </div>
        </div>
    </div>


    <div class="border rounded p-3 mb-4 bg-white">
        <h3 class="textcursive fs-5 mb-3 text-secondary">Управление пользователями</h3>
        <div class="table-responsive">
            <table class="table align-middle m-0">
                <thead class="table-light textcursive">
                <tr>
                    <th>ID</th>
                    <th>Email / Логин</th>
                    <th>Роль</th>
                    <th class="text-end">Действие</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="user : ${usersList}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.email}">user@spbutu.ru</td>
                    <td><span class="badge bg-secondary text-uppercase" th:text="${user.role}">USER</span></td>
                    <td class="text-end">
                        <form th:action="@{/admin/users/ban/{id}(id=${user.id})}" th:method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm textcursive">Забанить</button>
                        </form>
                    </td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>test@mail.ru</td>
                    <td><span class="badge bg-secondary">USER</span></td>
                    <td class="text-end">
                        <button class="btn btn-outline-danger btn-sm textcursive">Забанить</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</section>

<footer class="footer">
    <div class="section">
        <div class="footertext">Контактная информация</div>
        <div class="footerflex">
            <div class="footerbox">
                8 (800) 600-86-76<br>
                8 (800) 600-86-76
            </div>
            <div class="footerbox">
                СПбУТУиЭ
            </div>
            <div class="footerbox">
                © 2026 NoteTaking
            </div>
        </div>
    </div>
</footer>

</body>
</html>
