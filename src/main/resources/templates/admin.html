<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <title>Админка</title>
    <style>
        .font-cursive { font-family: cursive; }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-white">

<header class="bg-secondary text-white py-3">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/" class="text-white text-decoration-none font-cursive fs-1">Заметки</a>
            <nav class="d-flex gap-4">
                <a href="/admin.html" class="text-white text-decoration-none font-cursive fs-5">Админка</a>
                <a href="/trash.html" class="text-white text-decoration-none font-cursive fs-5">Корзина</a>
            </nav>
        </div>
    </div>
</header>

<main class="container py-4 flex-grow-1">

    <h1 class="font-cursive fs-2 mb-4">Панель администратора</h1>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="p-3 bg-light border rounded text-center">
                <div class="font-cursive text-muted small">Пользователи</div>
                <div class="fs-3 fw-bold font-cursive" th:text="${totalUsers}">150</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 bg-light border rounded text-center">
                <div class="font-cursive text-muted small">Всего заметок</div>
                <div class="fs-3 fw-bold font-cursive" th:text="${totalNotes}">1,420</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 bg-light border rounded text-center">
                <div class="font-cursive text-muted small">В корзине</div>
                <div class="fs-3 fw-bold font-cursive" th:text="${trashNotesCount}">84</div>
            </div>
        </div>
    </div>

    <div class="border rounded p-3 mb-4 bg-white">
        <h3 class="font-cursive fs-5 mb-3 text-secondary">Управление пользователями</h3>
        <div class="table-responsive">
            <table class="table align-middle m-0">
                <thead class="table-light font-cursive">
                <tr>
                    <th>ID</th>
                    <th>Email / Логин</th>
                    <th>Роль</th>
                    <th class="text-end">Действие</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${usersList}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.email}">user@spbutu.ru</td>
                    <td><span class="badge bg-secondary text-uppercase" th:text="${user.role}">USER</span></td>
                    <td class="text-end">
                        <form th:action="@{/admin/users/ban/{id}(id=${user.id})}" th:method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm font-cursive">Забанить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer class="bg-secondary text-white py-4 mt-auto">
    <div class="container">
        <div class="font-cursive fs-5 mb-2">Контактная информация</div>
        <div class="row text-center font-cursive">
            <div class="col">8 (800) 600-86-76<br>8 (800) 600-86-76</div>
            <div class="col">СПбУТУиЭ</div>
            <div class="col">© 2026 NoteTaking</div>
        </div>
    </div>
</footer>

</body>
</html>
