<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <title>Авторизация</title>
    <style>
        .font-cursive { font-family: cursive; }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="bg-secondary text-white py-3">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/" class="text-white text-decoration-none font-cursive fs-1">Заметки</a>
            <nav class="d-flex gap-4">
                <a href="/trash.html" class="text-white text-decoration-none font-cursive fs-5">Корзина</a>
                <a href="/authoriz.html" class="text-white text-decoration-none font-cursive fs-5">Войти</a>
            </nav>
        </div>
    </div>
</header>

<main class="container flex-grow-1 d-flex justify-content-center align-items-center py-5">
    <form th:action="@{/login}" method="post" class="w-100" style="max-width: 500px;">

        <div class="mb-3 font-cursive">
            <label for="exampleInputEmail1" class="form-label">Адрес электронной почты</label>
            <input type="email" name="username" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            <div id="emailHelp" class="form-text">Мы никогда никому не передадим вашу электронную почту.</div>
        </div>

        <div class="mb-3 font-cursive">
            <label for="exampleInputPassword1" class="form-label">Пароль</label>
            <input type="password" name="password" class="form-control" id="exampleInputPassword1">
        </div>

        <div class="mb-3 form-check font-cursive">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">Проверить меня</label>
        </div>

        <button type="submit" class="btn btn-secondary font-cursive">Отправить</button>
    </form>
</main>

<footer class="bg-secondary text-white py-4 mt-auto">
    <div class="container">
        <div class="font-cursive fs-5 mb-2">Контактная информация</div>
        <div class="row text-center font-cursive">
            <div class="col">8 (800) 600-86-76<br>8 (800) 600-86-76</div>
            <div class="col">СПбУТУиЭ</div>
            <div class="col">© 2026 NoteTaking</div>
        </div>
    </div>
</footer>

</body>
</html>
