<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <title>Заметки</title>
    <style>
        .font-cursive { font-family: cursive; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="bg-secondary text-white py-3">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/" class="text-white text-decoration-none font-cursive fs-1">Заметки</a>
            <nav class="d-flex gap-4">
                <a href="/trash" class="text-white text-decoration-none font-cursive fs-5">Корзина</a>
                <a href="/profile" class="text-white text-decoration-none font-cursive fs-5">Профиль</a>
                <a href="/login" class="text-white text-decoration-none font-cursive fs-5">Войти</a>
            </nav>
        </div>
    </div>
</header>

<main class="container py-4 flex-grow-1">

    <h1 class="font-cursive text-center mt-3 mb-4">Мои заметки</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="note : ${notes}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title font-cursive fw-bold" th:text="${note.title}">Название</h5>
                    <p class="card-text text-muted" th:text="${note.content}">Описание заметки...</p>
                </div>
                <div class="card-footer bg-transparent border-top-0 d-flex justify-content-between">
                    <a th:href="@{/zametki/edit/{id}(id=${note.id})}"
                       class="btn btn-outline-secondary btn-sm font-cursive">Редактировать</a>
                    <form th:action="@{/zametki/delete/{id}(id=${note.id})}" th:method="post">
                        <button type="submit" class="btn btn-outline-danger btn-sm font-cursive">Удалить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/zametki/add}" class="btn btn-dark font-cursive px-4">+ Добавить заметку</a>
    </div>

</main>

<footer class="bg-secondary text-white py-4 mt-auto">
    <div class="container">
        <div class="font-cursive fs-5 mb-2">Контактная информация</div>
        <div class="row text-center font-cursive">
            <div class="col">8 (800) 600-86-76<br>8 (800) 600-86-76</div>
            <div class="col">СПбУТУиЭ</div>
            <div class="col">© 2026 NoteTaking</div>
        </div>
    </div>
</footer>

</body>
</html>
